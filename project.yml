# XcodeGen project spec — the source of truth for RecipeExtractor.xcodeproj.
# Usage: brew install xcodegen && xcodegen generate
#
# The .xcodeproj is committed too, but every setting it carries must also
# live here. Anything set only in Xcode's UI is silently destroyed the next
# time this spec is generated.

name: RecipeExtractor
options:
  bundleIdPrefix: com.dadbytes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RecipeExtractor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Everything under RecipeExtractor/ is compiled or bundled, which is
      # how PrivacyInfo.xcprivacy gets into the app. Info.plist and the
      # entitlements are consumed via build settings below, so they must not
      # also be copied in as resources.
      - path: RecipeExtractor
        excludes:
          - "Info.plist"
          - "RecipeExtractor.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dadbytes.recipeextractor
        INFOPLIST_FILE: RecipeExtractor/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: RecipeExtractor/RecipeExtractor.entitlements

        # Version strings. Info.plist sets CFBundleVersion to
        # $(CURRENT_PROJECT_VERSION), so the build number is driven from here.
        # Bump CURRENT_PROJECT_VERSION for every upload — App Store Connect
        # rejects a build number it has already seen.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "5"

        # Signing. Team ID is required here — leaving it blank produces an
        # unsigned project that cannot archive.
        DEVELOPMENT_TEAM: Z7Q5NZT4ZL
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""

        # App Store listing identity.
        INFOPLIST_KEY_CFBundleDisplayName: "The Recipe Extractor"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.entertainment"

        # Info.plist is authored by hand; do not let Xcode synthesize keys
        # into it.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "NO"

        # Asset catalog. INCLUDE_ALL_APPICON_ASSETS is NO because AppIcon
        # ships a single 1024 image and lets Xcode downscale the rest.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "NO"

        # Products.storekit is a local testing config — development assets
        # are stripped from Release builds.
        DEVELOPMENT_ASSET_PATHS: '"RecipeExtractor/Products.storekit"'

        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - framework: StoreKit.framework
        weak: false
